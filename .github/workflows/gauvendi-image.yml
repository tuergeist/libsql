name: gauvendi-image

# Builds a linux/amd64 libsql-server image from this branch: sqld 0.24.33
# (d6c75af6, the commit of the upstream image we ran) plus the write-lock fixes for tursodatabase/libsql#2286.
# Also checks formatting and runs the connection unit tests on this branch
# and on the upstream PR branch.

on:
  workflow_dispatch:
  push:
    branches: [gauvendi]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/libsql-server
  PROTOC_VERSION: 3.23.4

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=gauvendi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest
        run: echo "digest=${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"

  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [gauvendi, fix/write-lock-stall-2286]
    env:
      RUSTFLAGS: --cfg tokio_unstable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: hecrj/setup-rust-action@v2
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      - name: Install deps
        run: sudo apt update && sudo apt install -y libclang-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: connection unit tests
        run: cargo test -p libsql-server --lib "connection::"
